name: Lab2 CI

on:
  push:
    branches: ["main", "Lab2"]
    paths:
      - "Laboratory-2/**"
      - ".github/workflows/Lab2-CI.yml"
  pull_request:
    paths:
      - "Laboratory-2/**"
permissions:
  contents: read

jobs:
  unit-tests:
    name: Tests, coverage and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv and Python
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.6"
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Run Ruff
        run: uv run --locked ruff check .

      - name: Run unit tests
        run: |
          uv run --locked coverage erase
          uv run --locked coverage run -m pytest -q

      - name: Show coverage and enforce 90% minimum
        run: uv run --locked coverage report --fail-under=90
  