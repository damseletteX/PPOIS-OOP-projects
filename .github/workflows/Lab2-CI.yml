name: TransportCompany CI

on:
  push:
    branches: ["main", "Lab2"]
    paths:
      - "Laboratory-2/**"
      - ".github/workflows/Lab2-CI.yml"
  pull_request:
    paths:
      - "Laboratory-2/**"

defaults:
  run:
    working-directory: Laboratory-2/

permissions:
  contents: read

jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install linter
        run: python -m pip install --upgrade pip ruff
      - name: Run Ruff
        run: ruff check .

  tests:
    name: Tests and coverage (95% minimum)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . -r requirements.txt
      - name: Run tests with coverage threshold
        run: python -m pytest
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore
